version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Propose a version only after it has been public for 3 days, which gives
    # the registry time to pull a compromised release before it reaches a PR.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    # Every package whose bump changes dist/action/ comes in one PR, so the
    # bundle is rebuilt and reviewed by hand at most once per week. That is
    # each runtime dependency, the @actions packages, ncc, and the TypeScript
    # compiler ncc uses. A new runtime dependency belongs in this list.
    groups:
      action-bundle:
        patterns:
          - "@actions/*"
          - "@vercel/ncc"
          - "acorn"
          - "acorn-walk"
          - "jsonc-parser"
          - "tar"
          - "typescript"
    ignore:
      # typescript-eslint 8.71.1 accepts typescript >=4.8.4 <6.1.0, so npm ci
      # fails with ERESOLVE on 7.x (#72). Remove once typescript-eslint
      # supports TypeScript 7.
      - dependency-name: "typescript"
        versions: [">= 7.0.0"]
      # Declined in #64: the V8 code cache dist/ncc/index.js.cache.js changed,
      # and capdelta cannot parse it.
      - dependency-name: "@vercel/ncc"
        versions: ["0.45.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
