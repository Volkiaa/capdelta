version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Propose a version only after it has been public for 3 days, which gives
    # the registry time to pull a compromised release before it reaches a PR.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    # Every package whose bump changes dist/action/ comes in one PR, so the
    # bundle is rebuilt and reviewed by hand at most once per week. That is
    # each runtime dependency, the @actions packages, ncc, and the TypeScript
    # compiler ncc uses. A new runtime dependency belongs in this list.
    groups:
      action-bundle:
        patterns:
          - "@actions/*"
          - "@vercel/ncc"
          - "acorn"
          - "acorn-walk"
          - "jsonc-parser"
          - "tar"
          - "typescript"
