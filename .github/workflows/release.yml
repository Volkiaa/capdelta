# ADR-022: a v* tag (admins only, per the "release tags" ruleset) runs a
# secret-free verify job, then a release job behind the "release" environment's
# required approval. The release job signs SLSA provenance and an SBOM for the
# Action bundle with the job's OIDC token, then publishes the GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tag to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Full verification, including a clean rebuild of the bundle
        run: npm run typecheck && npm run lint && npm run format:check && npm test && npm run check:deps && npm run check:action

  release:
    name: Attest and publish
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Creates the GitHub release.
      contents: write
      # Signs the attestations through Sigstore with the job's OIDC identity.
      id-token: write
      # Stores the attestations on the repository.
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Generate the SBOM of the bundled runtime dependencies
        run: npm sbom --sbom-format cyclonedx --package-lock-only --omit dev > capdelta.cdx.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/action/index.js
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/action/index.js
          sbom-path: capdelta.cdx.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" capdelta.cdx.json --verify-tag --generate-notes --title "$TAG"
