# Static analysis of these workflows: template injection, broad permissions,
# unpinned actions, persisted credentials. Fails the run on any finding.
name: zizmor

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/**"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Workflow security lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.30.1
          advanced-security: false
          online-audits: false
