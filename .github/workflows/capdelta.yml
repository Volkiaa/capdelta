# Dogfood the immutable bundled Action against this repository's own npm
# updates. pull_request_target is deliberately forbidden by PLAN §3.
name: capdelta

on:
  pull_request:
    paths:
      - package-lock.json

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Dependency capability review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The sticky PR comment.
      pull-requests: write
      # The SARIF upload to code scanning.
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: Volkiaa/capdelta@2535ee0940e25530a8aa7de23af17467727bb00e
        with:
          github-token: ${{ github.token }}
          fail-on: CRITICAL
          config-path: .capdelta.yml
