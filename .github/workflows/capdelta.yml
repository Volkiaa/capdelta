# Dogfood the immutable bundled Action against this repository's own npm
# updates. pull_request_target is deliberately forbidden by PLAN §3.
name: capdelta

on:
  pull_request:
    paths:
      - package-lock.json

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  review:
    name: Dependency capability review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: Volkiaa/capdelta@8b216e9d75b5e6d579e47d628ab9adac6eacda9d
        with:
          github-token: ${{ github.token }}
          fail-on: CRITICAL
          config-path: .capdelta.yml
