<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="capdelta-pipeline-title capdelta-pipeline-desc" id="capdelta-pipeline-root">
        <title id="capdelta-pipeline-title">From lockfile bump to gate verdict</title>
        <desc id="capdelta-pipeline-desc">capdelta diffs the base and head lockfiles, fetches and safely extracts each changed package from the npm registry without running it, diffs the capabilities of the old and new versions, and turns the findings into one gate severity using policy read from the base commit.</desc>
        <defs>
      <style>#capdelta-pipeline-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #capdelta-pipeline-root { font-family: var(--font-sans); color: var(--color-ink); }
      #capdelta-pipeline-root .diagram-container { width: 100%; overflow-x: auto; }
      #capdelta-pipeline-root .diagram-container { overflow-x: visible; }</style>
          <pattern id="capdelta-pipeline-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
          </pattern>
          <marker id="capdelta-pipeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="capdelta-pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="capdelta-pipeline-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#capdelta-pipeline-dots)" opacity="0.55"/>

        <!-- Zone: untrusted package bytes (bg, then zones, then arrows, then nodes) -->
        <rect x="240" y="128" width="616" height="128" rx="8"
              fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="464" y="132" width="184" height="12" rx="2" fill="#f5f5f5"/>
        <text x="556" y="141" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">UNTRUSTED BYTES · NEVER EXECUTED</text>

        <!-- Arrows -->
        <!-- Registry -> Fetcher -->
        <line x1="332" y1="88" x2="332" y2="160" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#capdelta-pipeline-arrow-link)"/>
        <!-- Row A, left to right -->
        <line x1="192" y1="192" x2="256" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#capdelta-pipeline-arrow)"/>
        <line x1="408" y1="192" x2="472" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#capdelta-pipeline-arrow)"/>
        <line x1="624" y1="192" x2="688" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#capdelta-pipeline-arrow)"/>
        <!-- Extractors -> Differ -->
        <line x1="764" y1="224" x2="764" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#capdelta-pipeline-arrow)"/>
        <!-- Row B, right to left -->
        <line x1="688" y1="352" x2="624" y2="352" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#capdelta-pipeline-arrow)"/>
        <line x1="472" y1="352" x2="408" y2="352" stroke="#bf4520" stroke-width="1.4" marker-end="url(#capdelta-pipeline-arrow-accent)"/>
        <!-- Policy -> Gate and Differ (passive config input) -->
        <line x1="600" y1="464" x2="600" y2="384" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#capdelta-pipeline-arrow)"/>
        <line x1="712" y1="464" x2="712" y2="384" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#capdelta-pipeline-arrow)"/>

        <!-- Arrow labels -->
        <rect x="340" y="100" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="368" y="109" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TARBALL</text>

        <rect x="204" y="172" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="224" y="181" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BUMPS</text>

        <rect x="416" y="172" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="440" y="181" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VERIFIED</text>

        <rect x="636" y="172" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="656" y="181" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FILES</text>

        <rect x="772" y="276" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="802" y="285" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OLD + NEW</text>

        <rect x="628" y="332" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="656" y="341" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FINDINGS</text>

        <rect x="416" y="332" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="440" y="341" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VERDICT</text>

        <rect x="524" y="416" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="558" y="425" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXCEPTIONS</text>

        <rect x="720" y="416" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="752" y="425" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ALLOWLIST</text>

        <!-- Node: npm registry (external) -->
        <rect x="256" y="24" width="152" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="256" y="24" width="152" height="64" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="264" y="32" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.22"/>
        <text x="278" y="41" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="332" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">npm registry</text>
        <text x="332" y="76" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dist.tarball URLs</text>

        <!-- Node: Lockfile differ (input) -->
        <rect x="40" y="160" width="152" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="160" width="152" height="64" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <rect x="48" y="168" width="24" height="12" rx="2" fill="none" stroke="#5a6580" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="60" y="177" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IN</text>
        <text x="116" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lockfile differ</text>
        <text x="116" y="212" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">base vs head lockfile</text>

        <!-- Node: Fetcher -->
        <rect x="256" y="160" width="152" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="256" y="160" width="152" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="264" y="168" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="278" y="177" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NET</text>
        <text x="332" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fetcher</text>
        <text x="332" y="212" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">checks lockfile hash</text>

        <!-- Node: Safe extractor -->
        <rect x="472" y="160" width="152" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="472" y="160" width="152" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="480" y="168" width="24" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="492" y="177" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FS</text>
        <text x="548" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Safe extractor</text>
        <text x="548" y="212" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">path guards · caps</text>

        <!-- Node: Extractors -->
        <rect x="688" y="160" width="152" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="688" y="160" width="152" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="696" y="168" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="710" y="177" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AST</text>
        <text x="764" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Extractors</text>
        <text x="764" y="212" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">manifest · AST · signals</text>

        <!-- Node: Capability differ -->
        <rect x="688" y="320" width="152" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="688" y="320" width="152" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="696" y="328" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="712" y="337" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DIFF</text>
        <text x="764" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Capability differ</text>
        <text x="764" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">additions only</text>

        <!-- Node: Run severity (focal) -->
        <rect x="472" y="320" width="152" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="472" y="320" width="152" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <rect x="480" y="328" width="32" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="496" y="337" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATE</text>
        <text x="548" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Run severity</text>
        <text x="548" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gateSeverity · exit</text>

        <!-- Node: Reporters -->
        <rect x="256" y="320" width="152" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="256" y="320" width="152" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="264" y="328" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="278" y="337" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
        <text x="332" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Reporters</text>
        <text x="332" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">text · SARIF · PR comment</text>

        <!-- Node: Policy (store) -->
        <rect x="580" y="464" width="152" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="580" y="464" width="152" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <rect x="588" y="472" width="28" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="602" y="481" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CFG</text>
        <text x="656" y="500" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">.capdelta.yml</text>
        <text x="656" y="516" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">read at base commit</text>

        <!-- Callout (bottom-left margin) -->
        <text x="40" y="488" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Policy comes from the base commit,</text>
        <text x="40" y="508" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">so a PR can't loosen its own gate.</text>
        <path d="M 260,500 Q 420,520 572,496" fill="none" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.40"/>
        <circle cx="576" cy="496" r="2" fill="#2d3142"/>

        <!-- Legend strip -->
        <line x1="40" y1="556" x2="920" y2="556" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="572" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="588" width="14" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="60" y="596" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Gate</text>

        <rect x="104" y="588" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="124" y="596" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Stage</text>

        <rect x="172" y="588" width="14" height="10" rx="2" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="192" y="596" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Input</text>

        <rect x="240" y="588" width="14" height="10" rx="2" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="260" y="596" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Policy</text>

        <rect x="312" y="588" width="14" height="10" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="332" y="596" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">External</text>

        <line x1="400" y1="594" x2="428" y2="594" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#capdelta-pipeline-arrow-link)"/>
        <text x="436" y="596" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTPS fetch</text>

        <line x1="520" y1="594" x2="548" y2="594" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#capdelta-pipeline-arrow)"/>
        <text x="556" y="596" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Data flow</text>

        <line x1="632" y1="594" x2="660" y2="594" stroke="#bf4520" stroke-width="1.4" marker-end="url(#capdelta-pipeline-arrow-accent)"/>
        <text x="668" y="596" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Verdict</text>

        <line x1="728" y1="594" x2="756" y2="594" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#capdelta-pipeline-arrow)"/>
        <text x="764" y="596" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Policy input</text>
      </svg>
